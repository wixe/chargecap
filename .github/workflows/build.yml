name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build on macOS
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Swift Version
        run: swift --version

      - name: Build Release Binary
        run: swift build -c release

      - name: Run Tests
        run: swift test || true

      - name: Verify Binary Exists & Size
        run: |
          ls -lh .build/release/chargecap || ls -lh .build/arm64-apple-macosx/release/chargecap
